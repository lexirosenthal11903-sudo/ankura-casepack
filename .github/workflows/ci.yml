name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Test data is valid
        run: npm run validate-data
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (no API key, no cost)
        run: npm test
      - run: npm run build
      - name: End-to-end smoke test (saved mode, no API key)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
